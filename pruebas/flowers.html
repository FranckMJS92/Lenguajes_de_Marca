<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Efecto Flores Amarillas</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #1a1a2e;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-end;
                overflow: hidden;
            }

            .container {
                position: relative;
                width: 100%;
                height: 100vh;
            }

            .flower__love {
                --love: #ffd700; /* Amarillo dorado */
                --line-w: 1.5vmin;
                position: absolute;
                bottom: 12vmin;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Tallo de la flor */
            .flower__stem {
                width: var(--line-w);
                height: 0;
                background: linear-gradient(to top, #2d5016, #1aaa15);
                position: relative;
                animation: growStem 2s ease-out forwards;
            }

            /* Flor - pétalos circulares */
            .flower__head {
                position: absolute;
                top: -8vmin;
                left: 50%;
                transform: translateX(-50%);
                opacity: 0;
                animation: bloomFlower 1s ease-out 1.8s forwards;
            }

            .flower__petal {
                position: absolute;
                width: 4vmin;
                height: 4vmin;
                background: var(--love);
                border-radius: 50%;
                transform-origin: center;
            }

            /* Crear múltiples pétalos en forma circular */
            .flower__petal:nth-child(1) {
                transform: rotate(0deg) translateX(3vmin);
            }
            .flower__petal:nth-child(2) {
                transform: rotate(45deg) translateX(3vmin);
            }
            .flower__petal:nth-child(3) {
                transform: rotate(90deg) translateX(3vmin);
            }
            .flower__petal:nth-child(4) {
                transform: rotate(135deg) translateX(3vmin);
            }
            .flower__petal:nth-child(5) {
                transform: rotate(180deg) translateX(3vmin);
            }
            .flower__petal:nth-child(6) {
                transform: rotate(225deg) translateX(3vmin);
            }
            .flower__petal:nth-child(7) {
                transform: rotate(270deg) translateX(3vmin);
            }
            .flower__petal:nth-child(8) {
                transform: rotate(315deg) translateX(3vmin);
            }

            /* Centro de la flor */
            .flower__center {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 2vmin;
                height: 2vmin;
                background: #8b4513;
                border-radius: 50%;
                z-index: 2;
            }

            /* Hojas */
            .flower__leaf {
                position: absolute;
                width: 3vmin;
                height: 1.5vmin;
                background: #2d5016;
                border-radius: 50%;
                opacity: 0;
                animation: growLeaf 0.5s ease-out 2s forwards;
            }

            .flower__leaf--left {
                top: -5vmin;
                left: -2vmin;
                transform: rotate(-30deg);
            }

            .flower__leaf--right {
                top: -5vmin;
                right: -2vmin;
                transform: rotate(30deg);
            }

            /* Animaciones */
            @keyframes growStem {
                from {
                    height: 0;
                }
                to {
                    height: 20vmin;
                }
            }

            @keyframes bloomFlower {
                from {
                    opacity: 0;
                    transform: translateX(-50%) scale(0.5);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) scale(1);
                }
            }

            @keyframes growLeaf {
                from {
                    opacity: 0;
                    transform: scale(0);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            /* Efecto de múltiples flores emergiendo */
            .flower__love:nth-child(1) {
                left: 20%;
                animation-delay: 0s;
            }
            .flower__love:nth-child(2) {
                left: 35%;
                animation-delay: 0.5s;
            }
            .flower__love:nth-child(3) {
                left: 50%;
                animation-delay: 1s;
            }
            .flower__love:nth-child(4) {
                left: 65%;
                animation-delay: 1.5s;
            }
            .flower__love:nth-child(5) {
                left: 80%;
                animation-delay: 2s;
            }

            /* Efecto de florecimiento continuo */
            @keyframes continuousBloom {
                0%,
                100% {
                    transform: translateX(-50%) scale(1);
                    opacity: 1;
                }
                50% {
                    transform: translateX(-50%) scale(1.1);
                    opacity: 0.8;
                }
            }

            .flower__head {
                animation:
                    bloomFlower 1s ease-out 1.8s forwards,
                    continuousBloom 3s ease-in-out 3s infinite;
            }
        </style>
    </head>

        <script>
            // Opcional: Agregar más flores dinámicamente
            document.addEventListener("DOMContentLoaded", function () {
                const container = document.querySelector(".container");

                // Crear flores adicionales cada 2 segundos
                setInterval(() => {
                    createRandomFlower();
                }, 2000);

                function createRandomFlower() {
                    const flower = document.createElement("div");
                    flower.className = "flower__love";
                    flower.style.left = Math.random() * 100 + "%";

                    flower.innerHTML = `
                    <div class="flower__stem">
                        <div class="flower__head">
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__petal"></div>
                            <div class="flower__center"></div>
                        </div>
                        <div class="flower__leaf flower__leaf--left"></div>
                        <div class="flower__leaf flower__leaf--right"></div>
                    </div>
                `;

                    container.appendChild(flower);

                    // Remover la flor después de un tiempo
                    setTimeout(() => {
                        flower.remove();
                    }, 8000);
                }
            });
        </script>
    </body>
</html>
