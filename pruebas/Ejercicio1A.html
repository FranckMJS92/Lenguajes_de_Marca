<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Ejercicio 1A</title>
        <style>
            * {
                box-sizing: border-box;
            }
            .contenedor {
                width: 1000px;
            }
            .box {
                background-color: #cccccc;
                color: #333333;
                font-weight: bold;
                text-align: center;
            }
            .a {
                width: 1000px;
                height: 60px;
            }
            .b {
                width: 1000px;
                height: 180px;
                margin-top: 20px;
            }
            .fila {
                display: flex;
                gap: 20px;
                margin-top: 20px;
            }
            .c {
                width: 800px;
                height: 60px;
            }
            .d {
                width: 800px;
                height: 520px;
            }
            .e,
            .f {
                width: 180px;
                height: 180px;
            }
            .g {
                width: 1000px;
                height: 60px;
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <div class="contenedor">
            <div class="box a">A</div>
            <div class="box b">B</div>
            <div class="fila">
                <div class="box c">C</div>
                <div class="box e">E</div>
            </div>
            <div class="fila">
                <div class="box d">D</div>
                <div class="box f">F</div>
            </div>
            <div class="box g">G</div>
        </div>
    </body>
</html>
